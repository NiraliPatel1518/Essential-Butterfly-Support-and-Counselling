name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: essential-butterfly

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build backend (tests run in Tests workflow)
        working-directory: ./essential-butterfly-backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean package -DskipTests

  frontend:
    name: Build and Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:ci

  docker-integration:
    name: Docker Build and Integration Tests
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI-only secret files
        run: |
          mkdir -p secrets
          printf '%s' 'ButterflyDB2026!' > secrets/postgres_password.txt
          printf '%s' 'ci@example.com' > secrets/gmail_username.txt
          printf '%s' 'ci-placeholder-password' > secrets/gmail_app_password.txt

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Build Docker images
        run: docker compose -f docker-compose.yml build

      - name: Start containers
        run: docker compose -f docker-compose.yml up -d

      - name: Check PostgreSQL readiness
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.yml exec -T db pg_isready -U postgres -d essential_butterfly; then
              exit 0
            fi
            sleep 5
          done
          echo "PostgreSQL did not become ready."
          exit 1

      - name: Check backend availability
        run: |
          for i in {1..30}; do
            if curl -sS -o /dev/null http://localhost:8080/; then
              echo "Backend is responding."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become available."
          docker compose -f docker-compose.yml logs backend
          exit 1

      - name: Check frontend availability
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5173/ -o /dev/null; then
              echo "Frontend is responding."
              exit 0
            fi
            sleep 5
          done
          echo "Frontend did not become available."
          docker compose -f docker-compose.yml logs frontend
          exit 1

      - name: Show container status
        if: always()
        run: docker compose -f docker-compose.yml ps

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml down -v

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - frontend
      - docker-integration
    if: >-
      github.event_name != 'pull_request' &&
      needs.build-backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.docker-integration.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./essential-butterfly-backend
          file: ./essential-butterfly-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/essential-butterfly:latest
            ${{ secrets.DOCKER_USERNAME }}/essential-butterfly:${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/essential-butterfly-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/essential-butterfly-frontend:${{ github.sha }}
