
name: Essential Butterfly CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || 'local' }}
  POSTGRES_PASSWORD: ci_test_password
  VITE_API_BASE_URL: http://localhost:8080
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

jobs:

  # 1. Build Application and Run Unit Tests
  build-and-test:
    name: Build Application and Run Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: essential_butterfly
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d essential_butterfly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:ci

      # Backend
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Allow Maven wrapper to run
        working-directory: backend
        run: chmod +x mvnw

      - name: Build backend and run tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/essential_butterfly
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci_test_password
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: ./mvnw --batch-mode clean verify

  # 2. Build Docker Images, Deploy Containers and Run Integration Checks
  docker-integration:
    name: Docker Build and Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Build both Docker images
      - name: Build Docker images
        run: docker compose -f backend/docker-compose.yml build

      # Start PostgreSQL, backend and frontend
      - name: Deploy containers using Docker Compose
        run: docker compose -f backend/docker-compose.yml up -d

      # Test frontend
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/; then
              echo "Frontend is responding."
              exit 0
            fi
            sleep 5
          done

          echo "Frontend did not become available."
          docker compose -f backend/docker-compose.yml logs
          exit 1

      # Test backend availability
      - name: Wait for backend
        run: |
          for i in {1..30}; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)

            if [[ "$STATUS" =~ ^[234][0-9][0-9]$ ]]; then
              echo "Backend is responding. HTTP status: $STATUS"
              exit 0
            fi

            sleep 5
          done

          echo "Backend did not become available."
          docker compose -f backend/docker-compose.yml logs backend
          exit 1

      - name: Display container status
        run: |
          docker compose -f backend/docker-compose.yml ps
          docker compose -f backend/docker-compose.yml logs --no-color

      # Clean up after integration checks
      - name: Stop containers
        if: always()
        run: docker compose -f backend/docker-compose.yml down

      # 3. Publish Docker Images
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish Docker images
        if: github.event_name != 'pull_request'
        run: |
          docker compose -f backend/docker-compose.yml push backend frontend
