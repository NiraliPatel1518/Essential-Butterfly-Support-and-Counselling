name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: essential-butterfly

jobs:
  build-test:
    name: Build Backend and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build backend and run tests
        working-directory: ./essential-butterfly-backend
        run: chmod +x ./mvnw && ./mvnw --batch-mode clean verify

  frontend-test:
    name: Build and Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:ci

  docker-integration:
    name: Docker Build and Integration Tests
    runs-on: ubuntu-latest
    needs: [build-test, frontend-test]

    env:
      A11Y_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI secret files
        run: |
          mkdir -p secrets

          # These values are for the temporary CI environment only.
          printf '%s' 'ci-only-postgres-password' > secrets/postgres_password.txt

          printf '%s' 'ci@example.com' > secrets/gmail_username.txt
          printf '%s' 'ci-placeholder-gmail-password' > secrets/gmail_app_password.txt

          printf '%s' 'ci-only-jwt-secret-ci-only-jwt-secret-ci-only-jwt-secret' > secrets/jwt_secret.txt

          printf '%s' 'ci-admin@example.com' > secrets/admin_email.txt
          printf '%s' 'ci-only-admin-password' > secrets/admin_password.txt

          printf '%s' 'AC00000000000000000000000000000000' > secrets/twilio_account_sid.txt
          printf '%s' 'ci-placeholder-twilio-auth-token' > secrets/twilio_auth_token.txt
          printf '%s' 'VA00000000000000000000000000000000' > secrets/twilio_verify_service_sid.txt

          touch secrets/google_calendar_client_id.txt
          touch secrets/google_calendar_client_secret.txt
          touch secrets/google_calendar_refresh_token.txt

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build Docker images
        run: docker compose -f docker-compose.yml build

      - name: Start containers
        run: docker compose -f docker-compose.yml up -d

      - name: Check PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U postgres -d essential_butterfly; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            sleep 5
          done

          echo "PostgreSQL did not become ready."
          exit 1

      - name: Check backend process
        run: |
          echo "Waiting for Spring Boot backend to start..."

          for i in {1..30}; do
            if ! docker compose ps --status running --services | grep -qx backend; then
              echo "Backend container is not running."
              docker compose logs --no-color backend
              exit 1
            fi

            if docker compose logs --no-color backend 2>&1 | grep -Fq "Started EssentialButterflyBackendApplication"; then
              echo "Spring Boot backend started successfully."
              exit 0
            fi

            echo "Backend is still starting... attempt $i/30"
            sleep 5
          done

          echo "Backend did not finish starting."
          docker compose logs --no-color backend
          exit 1

      - name: Check frontend
        run: |
          for i in {1..30}; do
            if curl -fsS --max-time 5 "$A11Y_BASE_URL/" >/dev/null; then
              echo "Frontend is responding."
              exit 0
            fi
            sleep 5
          done

          echo "Frontend did not become available."
          exit 1

      - name: Set up Node.js for accessibility scan
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install accessibility scan dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Accessibility Scan
        working-directory: ./frontend
        run: npm run test:a11y

      - name: Save accessibility report
        if: ${{ always() && hashFiles('frontend/test-results/accessibility.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: frontend/test-results/accessibility.json

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: [build-test, frontend-test, docker-integration]
    if: github.event_name != 'pull_request' && needs.build-test.result == 'success' && needs.frontend-test.result == 'success' && needs.docker-integration.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./essential-butterfly-backend
          file: ./essential-butterfly-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/essential-butterfly:latest
            ${{ secrets.DOCKER_USERNAME }}/essential-butterfly:${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/essential-butterfly-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/essential-butterfly-frontend:${{ github.sha }}