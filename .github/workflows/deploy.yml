name: Deploy to EC2

# Runs in two ways:
#  1. Automatically, after "CI/CD Pipeline" finishes successfully for a
#     push to main - only when the repository variable AUTO_DEPLOY is
#     "true" (Settings -> Secrets and variables -> Actions -> Variables).
#     It deploys the exact commit that CI tested.
#  2. By hand: Actions tab -> "Deploy to EC2" -> "Run workflow". You can
#     give a commit id that is on main (for example to go back to an
#     older version). Branches that are not merged into main are refused.
#
# The server-side steps are in scripts/deploy/ec2-deploy.sh (Docker Compose
# on the server) or scripts/deploy/ecs-deploy.sh (Amazon ECS), chosen by the
# repository variable DEPLOY_TARGET.

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit id on main to deploy (leave as 'main' for the latest)"
        required: true
        default: main

permissions:
  contents: read

# Only one deploy at a time; a newer one waits for the running one.
concurrency:
  group: production-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       vars.AUTO_DEPLOY == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which commit to deploy
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            sha="$RUN_SHA"
          else
            sha="$(git rev-parse --verify "origin/${INPUT_REF}^{commit}" 2>/dev/null \
                || git rev-parse --verify "${INPUT_REF}^{commit}")"
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main. Only code merged into main can be deployed."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      - name: Check deploy settings
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          missing=0
          for name in EC2_HOST EC2_SSH_KEY EC2_HOST_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          exit $missing

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          # Clean up copy/paste mistakes: spaces, line breaks, Windows "\r",
          # a pasted "http(s)://" or a trailing "/".
          host="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')"
          host="${host#http://}"; host="${host#https://}"; host="${host%/}"
          if ! [[ "$host" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Secret EC2_HOST is not a valid address. It must be only the Elastic IP, e.g. 184.193.202.252"
            exit 1
          fi
          host_key="$(printf '%s' "$EC2_HOST_KEY" | tr -d '\r' | awk '{print $1, $2}')"
          echo "DEPLOY_HOST=$host" >> "$GITHUB_ENV"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::Secret EC2_SSH_KEY is not a valid private key. Paste the whole labsuser.pem, including the BEGIN and END lines."
            exit 1
          fi
          # Pin the server's identity so we never send anything to the wrong machine.
          printf '%s %s\n' "$host" "$host_key" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on the server
        env:
          SHA: ${{ steps.target.outputs.sha }}
          # "ecs": the server builds the images and updates Amazon ECS
          # (scripts/deploy/ecs-deploy.sh). Anything else: the site runs on
          # the server itself with Docker Compose (scripts/deploy/ec2-deploy.sh).
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          if [ "$DEPLOY_TARGET" = "ecs" ]; then
            deploy_script=scripts/deploy/ecs-deploy.sh
          else
            deploy_script=scripts/deploy/ec2-deploy.sh
          fi
          echo "Deploy target: ${DEPLOY_TARGET:-ec2} ($deploy_script)"
          set +e
          out="$(ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 -o BatchMode=yes \
                 -o StrictHostKeyChecking=yes "ubuntu@${DEPLOY_HOST}" true 2>&1)"
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "$out"
            case "$out" in
              *"timed out"*|*"No route"*|*"Connection refused"*)
                echo "::error::Server not reachable. Is the AWS Academy lab started, the instance running, and port 22 open?" ;;
              *"Permission denied"*)
                echo "::error::Login rejected. EC2_SSH_KEY does not match the server (it must be labsuser.pem)." ;;
              *"Host key verification failed"*|*"REMOTE HOST IDENTIFICATION"*)
                echo "::error::Server identity does not match EC2_HOST_KEY. Re-copy it from /etc/ssh/ssh_host_ed25519_key.pub." ;;
              *)
                echo "::error::Could not connect to the server (see the message above)." ;;
            esac
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              "ubuntu@${DEPLOY_HOST}" "bash -s -- $SHA" < "$deploy_script" | tee deploy-output.txt
          # A deploy only counts when the script reached its very last line.
          if ! grep -qx 'DEPLOY-RESULT: OK' deploy-output.txt; then
            echo "::error::The deploy script ended before finishing (no DEPLOY-RESULT line). Treating the deploy as failed."
            exit 1
          fi

      - name: Check the public website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Repository variable SITE_URL is not set - skipping the public check."
            exit 0
          fi
          curl -fsS --max-time 15 -o /dev/null "$SITE_URL/"
          curl -fsS --max-time 15 -o /dev/null "$SITE_URL/api/features"
          echo "$SITE_URL is up."

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
