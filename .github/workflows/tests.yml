name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Unit Tests (JUnit + Mockito)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend unit and controller tests
        working-directory: ./essential-butterfly-backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode test "-Dtest=*Test"
