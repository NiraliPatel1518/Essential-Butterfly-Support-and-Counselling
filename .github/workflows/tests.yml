# Runs all automated tests on every push and pull request.
# Results: GitHub repo -> "Actions" tab -> click a run -> "Test Results" section.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

      - name: Show frontend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Frontend Test Results
          path: frontend/test-results/junit.xml
          reporter: java-junit

  backend:
    name: Backend tests (JUnit + Mockito)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Allow the Maven wrapper to run
        run: chmod +x mvnw

      # contextLoads needs a real database, so only unit and controller tests run here
      - name: Run backend tests
        run: ./mvnw -B test "-Dtest=*ServiceTest,*ControllerTest,*ValidationTest"

      - name: Show backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
