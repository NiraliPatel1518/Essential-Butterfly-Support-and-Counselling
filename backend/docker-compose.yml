services:

  db:
    image: postgres:17

    restart: always

    environment:
      POSTGRES_DB: essential_butterfly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d essential_butterfly"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:

  postgres-data: