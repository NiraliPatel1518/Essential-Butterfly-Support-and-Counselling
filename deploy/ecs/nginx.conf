# nginx for the "web" container on Amazon ECS.
# Same rules as gateway/nginx.conf (headers, limits, error page), plus it
# serves the React build itself. The backend container is reached at
# 127.0.0.1:8080 because all containers of an ECS task share one network.
#
# Traffic: browser -> HTTPS front (Caddy on EC2, or CloudFront) -> load
# balancer -> this nginx. Rate limits must apply per visitor, not to the
# load balancer's address, so the visitor's address is taken from:
#   - CloudFront's CloudFront-Viewer-Address header ("ip:port"), or
#   - the first X-Forwarded-For entry, which Caddy sets to the visitor's
#     address (Caddy replaces any value the visitor sends itself; the load
#     balancer only accepts traffic from Caddy or CloudFront).

map $http_x_forwarded_for $forwarded_ip {
    "~^\s*(?<first_ip>[^,\s]+)" $first_ip;
    default                     $remote_addr;
}

map $http_cloudfront_viewer_address $client_ip {
    "~^(?<viewer_ip>.+):[0-9]+$" $viewer_ip;
    default                       $forwarded_ip;
}

limit_req_zone $client_ip zone=api_limit:10m rate=15r/s;
limit_conn_zone $client_ip zone=client_connections:10m;

upstream backend_service {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 26m;
    limit_conn client_connections 30;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "gateway healthy\n";
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://backend_service;
    }

    # React routes (/login, /admin/...) all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 502 503 504 /service-unavailable.html;

    location = /service-unavailable.html {
        internal;
        default_type text/html;
        return 503 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service temporarily unavailable</title><style>body{font:18px/1.6 Arial,sans-serif;color:#32145f;max-width:42rem;margin:10vh auto;padding:2rem}a{color:#4b087c;font-weight:700}</style><main><h1>We will be right back</h1><p>The service is temporarily unavailable. Please wait a moment and try again.</p><p><a href="/">Return to the website</a></p></main></html>';
    }
}
