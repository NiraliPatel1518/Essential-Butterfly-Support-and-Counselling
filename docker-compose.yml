
services:
  db:
    image: postgres:17
    container_name: essential-butterfly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: essential_butterfly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d essential_butterfly"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./essential-butterfly-backend
      dockerfile: Dockerfile
    container_name: essential-butterfly-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/essential_butterfly
      SPRING_DATASOURCE_USERNAME: postgres
      APP_PUBLIC_BASE_URL: http://localhost:5173
    secrets:
      - postgres_password
      - gmail_username
      - gmail_app_password
      - jwt_secret
      - admin_email
      - admin_password
      - twilio_account_sid
      - twilio_auth_token
      - twilio_verify_service_sid
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export SPRING_DATASOURCE_PASSWORD="$$(tr -d '\r\n' < /run/secrets/postgres_password)"
        export GMAIL_USERNAME="$$(cat /run/secrets/gmail_username)"
        export GMAIL_APP_PASSWORD="$$(cat /run/secrets/gmail_app_password)"
        export JWT_SECRET="$$(cat /run/secrets/jwt_secret)"
        export ADMIN_EMAIL="$$(cat /run/secrets/admin_email)"
        export ADMIN_PASSWORD="$$(cat /run/secrets/admin_password)"
        export TWILIO_ACCOUNT_SID="$$(tr -d '\r\n' < /run/secrets/twilio_account_sid)"
        export TWILIO_AUTH_TOKEN="$$(tr -d '\r\n' < /run/secrets/twilio_auth_token)"
        export TWILIO_VERIFY_SERVICE_SID="$$(tr -d '\r\n' < /run/secrets/twilio_verify_service_sid)"
        exec java -jar app.jar
    ports:
      - "8080:8080"
    networks:
      - frontend-network
      - backend-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: essential-butterfly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: true

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  gmail_username:
    file: ./secrets/gmail_username.txt
  gmail_app_password:
    file: ./secrets/gmail_app_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  admin_email:
    file: ./secrets/admin_email.txt
  admin_password:
    file: ./secrets/admin_password.txt
  twilio_account_sid:
    file: ./secrets/twilio_account_sid.txt
  twilio_auth_token:
    file: ./secrets/twilio_auth_token.txt
  twilio_verify_service_sid:
    file: ./secrets/twilio_verify_service_sid.txt
