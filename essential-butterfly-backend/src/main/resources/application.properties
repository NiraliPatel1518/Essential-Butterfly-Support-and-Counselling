
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=essential-butterfly-backend
server.port=8080


# ==========================================
# DATABASE - POSTGRESQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/essential_butterfly}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# FLYWAY DATABASE MIGRATIONS
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true


# ==========================================
# EMAIL - GMAIL SMTP
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000


# ==========================================
# APPLICATION URLS
# ==========================================
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
# Admin account created on first start - supplied through environment variables
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}


# ==========================================
# JWT CONFIGURATION
# ==========================================
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:}}


# ==========================================
# CORS CONFIGURATION
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}


# ==========================================
# WEBSITE CONTENT AND RESOURCE LIBRARY (UC-09)
# ==========================================
app.content.max-file-size-bytes=${CONTENT_MAX_FILE_SIZE_BYTES:10485760}
app.content.allowed-file-extensions=${CONTENT_ALLOWED_FILE_EXTENSIONS:pdf,docx,png,jpg,jpeg}
app.content.allowed-link-schemes=${CONTENT_ALLOWED_LINK_SCHEMES:https}
# Hard ceiling Spring accepts before the application checks the exact limit above
spring.servlet.multipart.max-file-size=${CONTENT_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${CONTENT_MULTIPART_MAX_REQUEST_SIZE:26MB}


# ==========================================
# MEMORY WALL (UC-12)
# ==========================================
# "local" keeps the picture files in a folder (a Docker volume); "s3" will keep
# them in an AWS S3 bucket (see docs/operations/memory-wall-s3.md).
app.memory-wall.storage=${MEMORY_WALL_STORAGE:local}
app.memory-wall.storage-directory=${MEMORY_WALL_STORAGE_DIRECTORY:data/memory-wall}
app.memory-wall.max-photos=${MEMORY_WALL_MAX_PHOTOS:150}
app.memory-wall.max-published-photos=${MEMORY_WALL_MAX_PUBLISHED_PHOTOS:120}
app.memory-wall.max-file-size-bytes=${MEMORY_WALL_MAX_FILE_SIZE_BYTES:5242880}
app.memory-wall.allowed-file-extensions=${MEMORY_WALL_ALLOWED_FILE_EXTENSIONS:jpg,jpeg,png,webp}


# ==========================================
# APPOINTMENTS (UC-11)
# ==========================================
app.appointments.time-zone=${APPOINTMENTS_TIME_ZONE:America/Toronto}
app.appointments.booking-window-days=${APPOINTMENTS_BOOKING_WINDOW_DAYS:7}


# ==========================================
# GOOGLE CALENDAR (UC-11) - empty values switch the calendar step off
# ==========================================
app.google-calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
app.google-calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
app.google-calendar.refresh-token=${GOOGLE_CALENDAR_REFRESH_TOKEN:}
app.google-calendar.calendar-id=${GOOGLE_CALENDAR_ID:primary}
app.google-calendar.token-url=${GOOGLE_CALENDAR_TOKEN_URL:https://oauth2.googleapis.com/token}
app.google-calendar.api-base-url=${GOOGLE_CALENDAR_API_BASE_URL:https://www.googleapis.com/calendar/v3}


# ==========================================
# MAIL APPLICATION CONFIGURATION
# ==========================================
app.mail.from-address=${GMAIL_USERNAME:}


# ==========================================
# TWILIO SMS PHONE VERIFICATION
# ==========================================
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
app.twilio.verify-base-url=${TWILIO_VERIFY_BASE_URL:https://verify.twilio.com}
