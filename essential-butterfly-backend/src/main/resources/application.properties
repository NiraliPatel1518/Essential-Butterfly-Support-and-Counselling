
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=essential-butterfly-backend
server.port=8080


# ==========================================
# DATABASE - POSTGRESQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/essential_butterfly}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# EMAIL - GMAIL SMTP
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000


# ==========================================
# APPLICATION URLS
# ==========================================
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
# Admin account created on first start - supplied through environment variables
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}


# ==========================================
# JWT CONFIGURATION
# ==========================================
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:}}


# ==========================================
# CORS CONFIGURATION
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}


# ==========================================
# MAIL APPLICATION CONFIGURATION
# ==========================================
app.mail.from-address=${GMAIL_USERNAME:}


# ==========================================
# TWILIO SMS PHONE VERIFICATION
# ==========================================
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}
